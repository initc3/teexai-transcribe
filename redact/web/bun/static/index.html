<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RedactBench · smithers</title>
<style>
  :root{color-scheme:dark}
  body{font:15px/1.5 ui-sans-serif,system-ui,sans-serif;margin:0;background:#0e1116;color:#d7dde5}
  header{padding:16px 24px;border-bottom:1px solid #222a35}
  h1{margin:0;font-size:19px} header small{color:#8b97a7}
  main{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 58px)}
  aside{border-right:1px solid #222a35;overflow-y:auto;padding:12px}
  .sample{padding:9px 11px;border:1px solid #222a35;border-radius:8px;margin-bottom:8px;cursor:pointer}
  .sample:hover{border-color:#3a4757}.sample.sel{border-color:#5b8cff;background:#141b27}
  .sample b{display:block}.sample span{color:#8b97a7;font-size:12px}
  section{overflow-y:auto;padding:18px 22px}
  button{background:#5b8cff;color:#fff;border:0;padding:9px 16px;border-radius:8px;font-size:14px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  /* token HUD */
  #hud{display:flex;gap:22px;align-items:center;margin:14px 0 6px;flex-wrap:wrap}
  #hud .n{font-size:22px;font-weight:700}
  .in .n{color:#46d39a}.out .n{color:#5f8bff}.cost .n{color:#ffcf5f}
  #hud label{display:block;font-size:11px;color:#8b97a7;text-transform:uppercase;letter-spacing:.05em}
  #scope{width:100%;height:90px;display:block;border-radius:8px;background:#0a0d12;border:1px solid #1c232d}
  /* workflow */
  .stage{margin-top:18px}.stage h3{margin:0 0 8px;font-size:12px;color:#8b97a7;text-transform:uppercase;letter-spacing:.05em}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .node{border:1px solid #2a3340;border-radius:8px;padding:7px 10px;font-size:12.5px;min-width:120px;background:#121823;transition:.2s}
  .node .lab{font-weight:600}.node .t{color:#8b97a7;font-size:11px}
  .node.finished{border-color:#1f6b40;background:#0f2a1b}
  .node.running{border-color:#caa23a;background:#2a2310;animation:pulse 1s infinite}
  .node.failed{border-color:#7a2233;background:#2a1016}
  @keyframes pulse{50%{opacity:.55}}
  /* scorecard */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
  .card{border:1px solid #222a35;border-radius:10px;padding:14px}
  .card h4{margin:0 0 8px;font-size:13px;color:#8b97a7;text-transform:uppercase}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .clean{background:#10331f;color:#56d98a}.leak{background:#3a1620;color:#ff7a93}
  pre{white-space:pre-wrap;background:#0a0d12;border:1px solid #1c232d;border-radius:8px;padding:11px;font-size:12px;max-height:260px;overflow:auto;color:#c4ccd6}
  .delta{margin-top:14px;padding:11px 13px;border:1px solid #2a3340;border-radius:10px;background:#121823;font-size:14px}
  .hint{color:#8b97a7;font-size:13px;margin-left:10px}
</style></head>
<body>
<header><h1>RedactBench <small>— smithers workflow, live</small></h1>
<small>fan-out: 2 note-generations → leak/retention judges · glm-4.6 · token estimates leaving the Phala TEE</small></header>
<main>
  <aside id="list"></aside>
  <section>
    <button id="run" disabled>Run on selected sample</button><span class="hint" id="status"></span>
    <div id="hud">
      <div class="out"><label>tokens out (prompt)</label><div class="n" id="tout">0</div></div>
      <div class="in"><label>tokens in (completion)</label><div class="n" id="tin">0</div></div>
      <div class="cost"><label>est. cost</label><div class="n" id="cost">$0.000</div></div>
    </div>
    <canvas id="scope"></canvas>
    <div id="flow"></div>
    <div id="out"></div>
  </section>
</main>
<script>
const PRICE={in:0.6,out:2.2}; // $/1M tokens (glm-4.6, estimate)
let sel=null, hist=[];
const $=id=>document.getElementById(id);

function drawScope(){
  const cv=$('scope'),ctx=cv.getContext('2d'),w=cv.width=cv.clientWidth*2,h=cv.height=180;
  ctx.clearRect(0,0,w,h);
  if(hist.length<2)return;
  const max=Math.max(1,...hist.map(p=>Math.max(p.in,p.out)));
  const line=(key,color)=>{ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();
    hist.forEach((p,i)=>{const x=i/(hist.length-1)*w,y=h-10-(p[key]/max)*(h-20);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();};
  line('out','#5f8bff');line('in','#46d39a');
}

function nodeEl(n){
  const cls=n.state==='in-progress'?'running':n.state==='finished'?'finished':n.state==='failed'?'failed':'';
  const d=document.createElement('div');d.className='node '+cls;
  const t=n.tok?`<span class="t">${n.tok.out}→${n.tok.in} tok</span>`:`<span class="t">${n.state||'pending'}</span>`;
  d.innerHTML=`<div class="lab">${n.id}</div>${t}`;return d;
}

function renderFlow(nodes){
  const gen=nodes.filter(n=>n.id.startsWith('gen:'));
  const byVar=v=>nodes.filter(n=>n.id.includes(':'+v+':'));
  const flow=$('flow');flow.innerHTML='';
  const g=document.createElement('div');g.className='stage';
  g.innerHTML='<h3>generate</h3>';const gr=document.createElement('div');gr.className='row';
  gen.forEach(n=>gr.appendChild(nodeEl(n)));g.appendChild(gr);flow.appendChild(g);
  const j=document.createElement('div');j.className='stage';j.innerHTML='<h3>judges (leak + retention)</h3>';
  const cols=document.createElement('div');cols.className='cols';
  ['vanilla','augmented'].forEach(v=>{const c=document.createElement('div');const r=document.createElement('div');r.className='row';
    byVar(v).forEach(n=>r.appendChild(nodeEl(n)));c.innerHTML=`<div class="t" style="margin-bottom:6px">${v}</div>`;c.appendChild(r);cols.appendChild(c);});
  j.appendChild(cols);flow.appendChild(j);
}

function card(title,r){
  const cls=r.verdict==='CLEAN'?'clean':'leak';
  return `<div class="card"><h4>${title}</h4><span class="badge ${cls}">${r.verdict}</span>
    <div class="t" style="margin:8px 0">retention ${r.kept}/${r.n_keep}${r.leaks.length?` · <span style="color:#ff7a93">leaked: ${r.leaks.join(', ')}</span>`:''}</div>
    <pre>${(r.notes||'').replace(/</g,'&lt;')}</pre></div>`;
}

async function poll(runId){
  const r=await(await fetch('/api/run/'+runId)).json();
  $('tout').textContent=r.tokensOut;$('tin').textContent=r.tokensIn;
  $('cost').textContent='$'+((r.tokensOut*PRICE.in+r.tokensIn*PRICE.out)/1e6).toFixed(4);
  hist.push({in:r.tokensIn,out:r.tokensOut});drawScope();
  if(r.nodes.length)renderFlow(r.nodes);
  if(r.status==='finished'||r.status==='failed'){
    $('status').textContent=' '+r.status;$('run').disabled=false;
    const c=r.scorecard,dl=c.vanilla.leaks.length-c.augmented.leaks.length;
    $('out').innerHTML=`<div class="cards">${card('Vanilla (no skill)',c.vanilla)}${card('With skill',c.augmented)}</div>
      <div class="delta"><b>Skill effect:</b> leaks ${c.vanilla.leaks.length}→${c.augmented.leaks.length}, retention ${c.vanilla.kept}→${c.augmented.kept}</div>`;
    return;
  }
  setTimeout(()=>poll(runId),700);
}

async function run(){
  $('run').disabled=true;$('out').innerHTML='';hist=[];$('status').textContent=' starting…';
  const {runId}=await(await fetch('/api/run',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sample:sel})})).json();
  $('status').textContent=' running '+runId.slice(0,8);poll(runId);
}

(async()=>{
  const ss=await(await fetch('/api/samples')).json();
  $('list').innerHTML=ss.map(s=>`<div class="sample" data-id="${s.id}"><b>${s.id}</b><span>${s.n_strikes} strikes · ${s.audience}</span></div>`).join('');
  document.querySelectorAll('.sample').forEach(el=>el.onclick=()=>{
    document.querySelectorAll('.sample').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');sel=el.dataset.id;$('run').disabled=false;});
})();
$('run').onclick=run;
</script>
</body></html>
